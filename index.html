<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#f8f6ec" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <title>Delisy</title>
    <!-- Pantalla de carga: el logo en medio, con un aro que gira. Va aquí, y no en el CSS de la
         app, para que se vea desde el primer instante (al abrir o recargar), antes de que llegue el código.
         public/arranque.js le pone el logo y el color de la empresa recordada; src/main.tsx la quita al estar lista. -->
    <style>
      #arranque { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #f8f6ec; transition: opacity .3s ease; }
      #arranque.oscuro { background: #0e1611; }
      #arranque.fuera { opacity: 0; pointer-events: none; }
      .cargador { --carga-color: #113250; position: relative; display: grid; place-items: center; width: var(--carga-lado, 96px); aspect-ratio: 1; }
      .cargador-aro { position: absolute; inset: 0; border-radius: 50%; border: 3px solid color-mix(in srgb, var(--carga-color) 16%, transparent); border-top-color: var(--carga-color); animation: cargador-gira 1.1s cubic-bezier(.55,.15,.45,.85) infinite; }
      .cargador-logo { display: grid; place-items: center; width: 66%; aspect-ratio: 1; overflow: hidden; border-radius: 50%; background: #fdfdf8; color: #fff; font: 700 calc(var(--carga-lado, 96px) * .3)/1 system-ui, sans-serif; box-shadow: 0 6px 18px -8px rgba(0,32,20,.45); animation: cargador-late 1.6s ease-in-out infinite; }
      .cargador-logo.inicial { background: var(--carga-color); }
      .cargador-logo img { width: 76%; height: 76%; object-fit: contain; }
      @keyframes cargador-gira { to { transform: rotate(360deg); } }
      @keyframes cargador-late { 0%, 100% { transform: none; } 30% { transform: scale(1.09) rotate(-5deg); } 62% { transform: scale(.95) rotate(4deg); } }
      @media (prefers-reduced-motion: reduce) { .cargador-aro, .cargador-logo { animation: none; } #arranque { transition: none; } }
    </style>
  </head>
  <body>
    <div id="arranque" role="status" aria-label="Cargando">
      <div class="cargador" style="--carga-lado: 128px">
        <span class="cargador-aro"></span>
        <span class="cargador-logo"><img src="./icon.svg" alt="" /></span>
      </div>
    </div>
    <script src="./arranque.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
