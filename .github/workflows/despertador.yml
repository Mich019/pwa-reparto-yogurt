# Despierta al servidor cada 10 minutos para avisar de los pedidos urgentes sin atender (api/_lib/urgentes.ts).
# El cron de Vercel Hobby sólo corre una vez al día; con la app o el panel abiertos ya se revisa solo, esto cubre
# cuando nadie los tiene abiertos. Necesita en el repositorio:
#   · la variable API_URL (la misma de pages.yml, p. ej. https://tu-app.vercel.app/api)
#   · el secreto CRON_SECRET (el mismo valor que en Vercel)
# Sin ellos no hace nada. GitHub puede retrasar los cron unos minutos.
name: despertador

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  urgentes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Revisar urgentes sin atender
        env:
          API_URL: ${{ vars.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Falta API_URL o CRON_SECRET: no se hace nada"; exit 0; fi
          curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "${API_URL%/}/cron/urgentes"
