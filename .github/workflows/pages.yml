name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Dirección del servidor (Settings > Variables > API_URL). Vacía = la app funciona sólo en el teléfono.
          VITE_API_URL: ${{ vars.API_URL }}
          # Sin servidor, la copia de GitHub Pages trabaja sin cuentas (si no, pediría entrar contra una API que no existe).
          VITE_OFFLINE_SOLO: ${{ vars.API_URL == '' && 'true' || 'false' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
